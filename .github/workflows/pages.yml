name: Browser editor Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workspace dependencies
        run: npm ci
      - uses: ./.github/actions/browser-vm
      - name: Build shared audio assets
        run: npm run audio:build
      # Firmware belongs to deliberate GitHub Releases. The website catalogue
      # importer will consume published, attested bundles; main is not a release.
      - name: Package browser editor
        run: python tools/build_editor.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    # Build private repositories and PRs, but publish only public main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy browser editor
        id: deployment
        uses: actions/deploy-pages@v4
