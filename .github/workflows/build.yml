name: Portable engine and firmware
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [host, host-175]
        # WebSocket profiles also enable MQTT to exercise coexistence.
        transport: [usb, http, websocket, mqtt]
        boot_sequence: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - name: Configure and build
        shell: bash
        run: |
          board_args=()
          if [[ '${{ matrix.profile }}' == host-175 ]]; then
            board_args=(-DLIGHTVM_BOARD_CONFIG="$PWD/tests/boards/host_175.h")
          fi
          cmake -S . -B build/${{ matrix.profile }}-${{ matrix.transport }} -DLIGHTVM_PLATFORM=host -DLIGHTVM_HTTP=${{ (matrix.transport == 'http' || matrix.transport == 'websocket') && 'ON' || 'OFF' }} -DLIGHTVM_WEBSOCKET=${{ matrix.transport == 'websocket' && 'ON' || 'OFF' }} -DLIGHTVM_MQTT=${{ (matrix.transport == 'websocket' || matrix.transport == 'mqtt') && 'ON' || 'OFF' }} -DLIGHTVM_BOOT_SEQUENCE=${{ matrix.boot_sequence }} -DCMAKE_BUILD_TYPE=Release "${board_args[@]}"
          cmake --build build/${{ matrix.profile }}-${{ matrix.transport }} --parallel 2
          size build/${{ matrix.profile }}-${{ matrix.transport }}/lightvm > build/${{ matrix.profile }}-${{ matrix.transport }}/size.txt
      - name: Contract and integration tests
        env:
          LIGHTVM_RECEIVER: ${{ github.workspace }}/build/${{ matrix.profile }}-${{ matrix.transport }}/lightvm
        run: |
          python -B tests/generate_bytecode_fixtures.py --check
          python -B tests/generate_portable_fixtures.py --check
          ctest --test-dir build/${{ matrix.profile }}-${{ matrix.transport }} --output-on-failure
          python -m unittest discover -s tests -v
          node --test tests/test_editor.mjs
          npm run build
          npm test
      - name: Power recovery policy and HTTP integration
        if: matrix.profile == 'host' && matrix.transport == 'http' && matrix.boot_sequence == 'ON'
        run: |
          cmake -S . -B build/power-recovery-host -DLIGHTVM_PLATFORM=host -DLIGHTVM_WIFI=ON -DLIGHTVM_HTTP=ON -DLIGHTVM_BOOT_SEQUENCE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/power-recovery-host --parallel 2
          ctest --test-dir build/power-recovery-host --output-on-failure
          LIGHTVM_RECOVERY_RECEIVER="$PWD/build/power-recovery-host/lightvm" python -m unittest discover -s tests -p 'test_power_recovery.py' -v
          LIGHTVM_SETUP_RECEIVER="$PWD/build/power-recovery-host/lightvm" python -m unittest discover -s tests -p 'test_wifi_setup.py' -v
      - name: Portable smoke checks
        shell: bash
        run: |
          board=simulator
          if [[ '${{ matrix.profile }}' == host-175 ]]; then board=test_175; fi
          python tools/smoke_controller.py --process build/${{ matrix.profile }}-${{ matrix.transport }}/lightvm --board "$board" --reference build/${{ matrix.profile }}-${{ matrix.transport }}/lightvm
      - uses: actions/upload-artifact@v4
        with:
          name: lightvm-${{ matrix.profile }}-${{ matrix.transport }}-boot-${{ matrix.boot_sequence }}
          path: |
            build/${{ matrix.profile }}-${{ matrix.transport }}/lightvm
            build/${{ matrix.profile }}-${{ matrix.transport }}/size.txt
            build/${{ matrix.profile }}-${{ matrix.transport }}/LICENSE
            build/${{ matrix.profile }}-${{ matrix.transport }}/THIRD_PARTY_NOTICES.md
            build/${{ matrix.profile }}-${{ matrix.transport }}/licenses/

  pico:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: [pico, pico-w-usb, pico-w-wifi, pico-w-http, pico-w-websocket, pico-w-mqtt, pico2-w-usb, pico2-w-wifi, pico2-w-http, pico2-w-websocket, pico2-w-mqtt]
        boot_sequence: ['OFF', 'ON']
        include:
          - {name: pico, board: pico, wifi: 'OFF', http: 'OFF'}
          - {name: pico-w-usb, board: pico_w, wifi: 'OFF', http: 'OFF'}
          - {name: pico-w-wifi, board: pico_w, wifi: 'ON', http: 'OFF'}
          - {name: pico-w-http, board: pico_w, wifi: 'ON', http: 'ON'}
          - {name: pico-w-websocket, board: pico_w, wifi: 'ON', http: 'ON', mqtt: 'ON'}
          - {name: pico-w-mqtt, board: pico_w, wifi: 'ON', http: 'OFF', mqtt: 'ON'}
          - {name: pico2-w-usb, board: pico2_w, wifi: 'OFF', http: 'OFF'}
          - {name: pico2-w-wifi, board: pico2_w, wifi: 'ON', http: 'OFF'}
          - {name: pico2-w-http, board: pico2_w, wifi: 'ON', http: 'ON'}
          - {name: pico2-w-websocket, board: pico2_w, wifi: 'ON', http: 'ON', mqtt: 'ON'}
          - {name: pico2-w-mqtt, board: pico2_w, wifi: 'ON', http: 'OFF', mqtt: 'ON'}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Pico SDK and Arm compiler
        shell: bash
        run: |
          mkdir -p build/deps
          git clone --branch 2.3.1 --depth 1 https://github.com/raspberrypi/pico-sdk.git build/deps/pico-sdk
          git -C build/deps/pico-sdk submodule update --init lib/tinyusb lib/cyw43-driver lib/lwip
          curl --fail --location --retry 3 https://developer.arm.com/-/media/Files/downloads/gnu/13.2.Rel1/binrel/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi.tar.xz -o build/deps/arm.tar.xz
          tar -xJf build/deps/arm.tar.xz -C build/deps
          echo "$PWD/build/deps/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: Build firmware
        run: |
          cmake -S . -B build/${{ matrix.name }} -DLIGHTVM_PLATFORM=pico -DPICO_BOARD=${{ matrix.board }} -DLIGHTVM_WIFI=${{ matrix.wifi }} -DLIGHTVM_HTTP=${{ matrix.http }} -DLIGHTVM_WEBSOCKET=${{ (matrix.name == 'pico-w-websocket' || matrix.name == 'pico2-w-websocket') && 'ON' || 'OFF' }} -DLIGHTVM_MQTT=${{ matrix.mqtt || 'OFF' }} -DLIGHTVM_BOOT_SEQUENCE=${{ matrix.boot_sequence }} -DPICO_SDK_PATH="$PWD/build/deps/pico-sdk" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/${{ matrix.name }} --parallel 2
          arm-none-eabi-size build/${{ matrix.name }}/lightvm.elf > build/${{ matrix.name }}/size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lightvm-${{ matrix.name }}-boot-${{ matrix.boot_sequence }}
          path: |
            build/${{ matrix.name }}/lightvm.uf2
            build/${{ matrix.name }}/storage-layout.json
            build/${{ matrix.name }}/lightvm.elf
            build/${{ matrix.name }}/size.txt
            build/${{ matrix.name }}/LICENSE
            build/${{ matrix.name }}/THIRD_PARTY_NOTICES.md
            build/${{ matrix.name }}/licenses/
            build/${{ matrix.name }}/ram-report.json

  esp32:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.3
    env:
      IDF_COMPONENT_MANAGER: '0'
    strategy:
      fail-fast: false
      matrix:
        board: [xiao_esp32c3, xiao_esp32s3, xiao_esp32c6]
        transport: [usb, wifi, http, websocket, mqtt]
        boot_sequence: ['OFF', 'ON']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware and record size
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C platforms/esp32 -B "$PWD/build/${{ matrix.board }}-${{ matrix.transport }}" -D LIGHTVM_BOARD=${{ matrix.board }} -D LIGHTVM_WIFI=${{ matrix.transport != 'usb' && 'ON' || 'OFF' }} -D LIGHTVM_HTTP=${{ (matrix.transport == 'http' || matrix.transport == 'websocket') && 'ON' || 'OFF' }} -D LIGHTVM_WEBSOCKET=${{ matrix.transport == 'websocket' && 'ON' || 'OFF' }} -D LIGHTVM_MQTT=${{ (matrix.transport == 'websocket' || matrix.transport == 'mqtt') && 'ON' || 'OFF' }} -D LIGHTVM_BOOT_SEQUENCE=${{ matrix.boot_sequence }} build
          idf.py -C platforms/esp32 -B "$PWD/build/${{ matrix.board }}-${{ matrix.transport }}" size > build/${{ matrix.board }}-${{ matrix.transport }}/size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lightvm-${{ matrix.board }}-${{ matrix.transport }}-boot-${{ matrix.boot_sequence }}
          path: |
            build/${{ matrix.board }}-${{ matrix.transport }}/lightvm.bin
            build/${{ matrix.board }}-${{ matrix.transport }}/lightvm.elf
            build/${{ matrix.board }}-${{ matrix.transport }}/lightvm.map
            build/${{ matrix.board }}-${{ matrix.transport }}/bootloader/bootloader.bin
            build/${{ matrix.board }}-${{ matrix.transport }}/partition_table/partition-table.bin
            build/${{ matrix.board }}-${{ matrix.transport }}/flasher_args.json
            build/${{ matrix.board }}-${{ matrix.transport }}/flash_args
            build/${{ matrix.board }}-${{ matrix.transport }}/sdkconfig
            build/${{ matrix.board }}-${{ matrix.transport }}/size.txt
            build/${{ matrix.board }}-${{ matrix.transport }}/LICENSE
            build/${{ matrix.board }}-${{ matrix.transport }}/THIRD_PARTY_NOTICES.md
            build/${{ matrix.board }}-${{ matrix.transport }}/licenses/
