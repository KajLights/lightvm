name: Portable engine and firmware
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [host, host-175]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Configure and build
        shell: bash
        run: |
          board_args=()
          if [[ '${{ matrix.profile }}' == host-175 ]]; then
            board_args=(-DLIGHTVM_BOARD_CONFIG="$PWD/tests/boards/host_175.h")
          fi
          cmake -S . -B build/${{ matrix.profile }} -DLIGHTVM_PLATFORM=host -DCMAKE_BUILD_TYPE=Release "${board_args[@]}"
          cmake --build build/${{ matrix.profile }} --parallel 2
          size build/${{ matrix.profile }}/lightvm > build/${{ matrix.profile }}/size.txt
      - name: Contract and integration tests
        env:
          LIGHTVM_RECEIVER: ${{ github.workspace }}/build/${{ matrix.profile }}/lightvm
        run: |
          ctest --test-dir build/${{ matrix.profile }} --output-on-failure
          python -m unittest discover -s tests -v
      - name: Portable smoke checks
        shell: bash
        run: |
          board=simulator
          if [[ '${{ matrix.profile }}' == host-175 ]]; then board=test_175; fi
          python tools/smoke_device.py --process build/${{ matrix.profile }}/lightvm --board "$board" --reference build/${{ matrix.profile }}/lightvm
      - uses: actions/upload-artifact@v4
        with:
          name: lightvm-${{ matrix.profile }}
          path: |
            build/${{ matrix.profile }}/lightvm
            build/${{ matrix.profile }}/size.txt
            build/${{ matrix.profile }}/LICENSE
            build/${{ matrix.profile }}/THIRD_PARTY_NOTICES.md
            build/${{ matrix.profile }}/licenses/

  pico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Pico SDK and Arm compiler
        shell: bash
        run: |
          mkdir -p build/deps
          git clone --branch 1.5.1 --depth 1 https://github.com/raspberrypi/pico-sdk.git build/deps/pico-sdk
          git -C build/deps/pico-sdk submodule update --init lib/tinyusb
          curl --fail --location --retry 3 https://developer.arm.com/-/media/Files/downloads/gnu/13.2.Rel1/binrel/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi.tar.xz -o build/deps/arm.tar.xz
          tar -xJf build/deps/arm.tar.xz -C build/deps
          echo "$PWD/build/deps/arm-gnu-toolchain-13.2.Rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"
      - name: Build firmware
        run: |
          cmake -S . -B build/pico -DLIGHTVM_PLATFORM=pico -DPICO_BOARD=pico -DPICO_SDK_PATH="$PWD/build/deps/pico-sdk" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/pico --parallel 2
          arm-none-eabi-size build/pico/lightvm.elf > build/pico/size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lightvm-pico
          path: |
            build/pico/lightvm.uf2
            build/pico/lightvm.elf
            build/pico/size.txt
            build/pico/LICENSE
            build/pico/THIRD_PARTY_NOTICES.md
            build/pico/licenses/

  esp32:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.3
    env:
      IDF_COMPONENT_MANAGER: '0'
    strategy:
      fail-fast: false
      matrix:
        board: [xiao_esp32s3, xiao_esp32c6]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware and record size
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C platforms/esp32 -B "$PWD/build/${{ matrix.board }}" -D LIGHTVM_BOARD=${{ matrix.board }} build
          idf.py -C platforms/esp32 -B "$PWD/build/${{ matrix.board }}" size > build/${{ matrix.board }}/size.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lightvm-${{ matrix.board }}
          path: |
            build/${{ matrix.board }}/lightvm.bin
            build/${{ matrix.board }}/lightvm.elf
            build/${{ matrix.board }}/lightvm.map
            build/${{ matrix.board }}/bootloader/bootloader.bin
            build/${{ matrix.board }}/partition_table/partition-table.bin
            build/${{ matrix.board }}/flasher_args.json
            build/${{ matrix.board }}/flash_args
            build/${{ matrix.board }}/sdkconfig
            build/${{ matrix.board }}/size.txt
            build/${{ matrix.board }}/LICENSE
            build/${{ matrix.board }}/THIRD_PARTY_NOTICES.md
            build/${{ matrix.board }}/licenses/
